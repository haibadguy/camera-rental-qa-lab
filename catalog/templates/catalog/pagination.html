{% if page.has_other_pages %}
  <nav class="actions" aria-label="Phân trang">
    {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}{{ anchor }}">Trang trước</a>{% endif %}
    <span>Trang {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}{{ anchor }}">Trang sau</a>{% endif %}
  </nav>
{% endif %}
