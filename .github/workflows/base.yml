name: Camera Rental Base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated environment
        run: |
          printf 'DJANGO_SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
      - name: Build, migrate, seed and start
        run: |
          docker compose config --quiet
          docker compose up --build --wait
      - name: Check Django, migrations and PostgreSQL integration
        run: |
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py test
      - name: Check live application
        run: docker compose exec -T web python scripts/smoke.py
      - name: Services on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
